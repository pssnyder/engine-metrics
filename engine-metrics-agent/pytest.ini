# Pytest Configuration for V7P3R Chess Engine Analytics AI Service
# Enterprise-grade Python testing setup with comprehensive coverage

[tool:pytest]
# Test discovery
testpaths = tests src/ai/tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Coverage configuration
addopts = 
    --strict-markers
    --strict-config
    --cov=src/ai
    --cov-report=html:coverage/python
    --cov-report=term-missing
    --cov-report=json:coverage/python/coverage.json
    --cov-report=lcov:coverage/python/lcov.info
    --cov-fail-under=80
    --cov-branch
    --show-capture=no
    --tb=short
    --maxfail=5
    -v

# Test markers for categorization
markers =
    unit: Unit tests
    integration: Integration tests
    security: Security tests
    performance: Performance tests
    slow: Slow tests (may take several seconds)
    external: Tests requiring external services
    ai: AI and machine learning tests
    api: API integration tests

# Minimum pytest version
minversion = 7.0

# Test timeout
timeout = 300

# Asyncio configuration
asyncio_mode = auto

# Filterwarnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Log configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage configuration details
[coverage:run]
source = src/ai
branch = True
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */migrations/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:

[coverage:html]
directory = coverage/python/html

[coverage:json]
output = coverage/python/coverage.json

[coverage:lcov]
output = coverage/python/lcov.info